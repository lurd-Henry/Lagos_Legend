name: Lagos Legends CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server/server.js

      - name: Check frontend JavaScript syntax
        run: |
          for file in public/js/*.js; do
            node --check "$file"
          done

      - name: Build Docker image
        run: docker build -t lagos-legends:ci .

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: validate

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lagos-legends:${{ github.sha }} .
